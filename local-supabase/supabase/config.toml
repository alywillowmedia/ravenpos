# Isolated Supabase stack used to restore a production-shaped public-schema clone.
# It intentionally has no migrations or seed files: scripts/local-supabase-clone.sh
# restores a linked-project dump directly, then applies the migration under test.
project_id = "ravenpos-local-clone"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
# The linked project dump reports PostgreSQL 17.6.
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1:55321"

[inbucket]
enabled = true
port = 55324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
